name: sigr-prod

x-app: &app
  image: sigr/app:prod
  restart: unless-stopped
  env_file: .env.prod
  networks: [internal]

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: app
    command: >
      sh -c "php artisan package:discover --ansi &&
             php artisan config:cache &&
             php artisan route:cache &&
             php artisan view:cache &&
             exec php-fpm"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: web
    image: sigr/web:prod
    restart: unless-stopped
    ports:
      # Por defecto solo localhost (para poner Caddy/Traefik delante).
      # Para exponerlo directo: APP_BIND=0.0.0.0 y APP_PORT=80 en .env.prod
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:80'
    volumes:
      - app-storage:/var/www/html/storage:ro
    networks: [internal]
    depends_on: [app]

  queue:
    <<: *app
    user: www-data
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - app-storage:/var/www/html/storage
    depends_on: [app]

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?define DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-sigr}
      MYSQL_USER: ${DB_USERNAME:-sigr_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?define REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

networks:
  internal:
    driver: bridge

volumes:
  app-storage:
  mysql-data:
  redis-data:
