services:
    # --------------------------------------------------------------------------
    # 1. Aplicación Laravel (PHP 8.4-FPM — sin php artisan serve)
    # --------------------------------------------------------------------------
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: sigr-app:latest
        container_name: sigr-app
        restart: unless-stopped
        env_file:
            - .env
        environment:
            DB_HOST: '${DOCKER_DB_HOST:-mysql}'
            DB_AUDIT_HOST: '${DOCKER_DB_HOST:-mysql}'
            REDIS_HOST: '${DOCKER_REDIS_HOST:-redis}'
            AUTO_MIGRATE: '${AUTO_MIGRATE:-true}'
            AUTO_SEED: '${AUTO_SEED:-false}'
        volumes:
            - .:/var/www/html
            - sigr-vendor:/var/www/html/vendor
            - sigr-public-build:/var/www/html/public/build
        networks:
            - sigr-network
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "test -f /tmp/app-ready && pgrep php-fpm >/dev/null"]
            interval: 5s
            timeout: 3s
            retries: 30

    # --------------------------------------------------------------------------
    # 2. Servidor Web Nginx (Reverse Proxy FastCGI + WebSockets para VPS)
    # --------------------------------------------------------------------------
    nginx:
        image: nginx:1.27-alpine
        container_name: sigr-nginx
        restart: unless-stopped
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - .:/var/www/html:ro
            - sigr-public-build:/var/www/html/public/build:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - sigr-network
        depends_on:
            app:
                condition: service_healthy
            reverb:
                condition: service_started

    # --------------------------------------------------------------------------
    # 3. Worker de Colas en Segundo Plano (Correos, Facturas FAC, Eventos)
    # --------------------------------------------------------------------------
    queue:
        image: sigr-app:latest
        container_name: sigr-queue
        restart: unless-stopped
        command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
        env_file:
            - .env
        environment:
            DB_HOST: '${DOCKER_DB_HOST:-mysql}'
            DB_AUDIT_HOST: '${DOCKER_DB_HOST:-mysql}'
            REDIS_HOST: '${DOCKER_REDIS_HOST:-redis}'
        volumes:
            - .:/var/www/html
            - sigr-vendor:/var/www/html/vendor
            - sigr-public-build:/var/www/html/public/build
        networks:
            - sigr-network
        depends_on:
            app:
                condition: service_healthy
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # --------------------------------------------------------------------------
    # 4. Servidor WebSocket Laravel Reverb (KDS Cocina, Caja y Pedidos en Vivo)
    # --------------------------------------------------------------------------
    reverb:
        image: sigr-app:latest
        container_name: sigr-reverb
        restart: unless-stopped
        command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
        ports:
            - '${REVERB_SERVER_PORT:-8080}:8080'
        env_file:
            - .env
        environment:
            DB_HOST: '${DOCKER_DB_HOST:-mysql}'
            DB_AUDIT_HOST: '${DOCKER_DB_HOST:-mysql}'
            REDIS_HOST: '${DOCKER_REDIS_HOST:-redis}'
        volumes:
            - .:/var/www/html
            - sigr-vendor:/var/www/html/vendor
            - sigr-public-build:/var/www/html/public/build
        networks:
            - sigr-network
        depends_on:
            app:
                condition: service_healthy
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # --------------------------------------------------------------------------
    # 5. Programador de Tareas (Cron / Scheduler de Reservas y Respaldos)
    # --------------------------------------------------------------------------
    scheduler:
        image: sigr-app:latest
        container_name: sigr-scheduler
        restart: unless-stopped
        command: ["php", "artisan", "schedule:work"]
        env_file:
            - .env
        environment:
            DB_HOST: '${DOCKER_DB_HOST:-mysql}'
            DB_AUDIT_HOST: '${DOCKER_DB_HOST:-mysql}'
            REDIS_HOST: '${DOCKER_REDIS_HOST:-redis}'
        volumes:
            - .:/var/www/html
            - sigr-vendor:/var/www/html/vendor
            - sigr-public-build:/var/www/html/public/build
        networks:
            - sigr-network
        depends_on:
            app:
                condition: service_healthy
            mysql:
                condition: service_healthy

    # --------------------------------------------------------------------------
    # 6. Base de Datos MySQL 8.0 (UTF8MB4)
    # --------------------------------------------------------------------------
    mysql:
        image: mysql:8.0
        container_name: sigr-mysql
        restart: unless-stopped
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        env_file:
            - .env
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-${DB_PASSWORD:-}}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
            MYSQL_DATABASE: '${DB_DATABASE:-sigr}'
            APP_DB_USERNAME: '${DB_USERNAME:-root}'
            APP_DB_PASSWORD: '${DB_PASSWORD:-}'
            TZ: 'America/Bogota'
        volumes:
            - sigr-mysql-data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        networks:
            - sigr-network
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
            interval: 5s
            timeout: 5s
            retries: 10

    # --------------------------------------------------------------------------
    # 7. Caché y Sesiones Redis 7 Alpine
    # --------------------------------------------------------------------------
    redis:
        image: redis:7-alpine
        container_name: sigr-redis
        restart: unless-stopped
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - sigr-redis-data:/data
        networks:
            - sigr-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    # --------------------------------------------------------------------------
    # 8. Servidor SMTP Local / Staging (Mailpit)
    # --------------------------------------------------------------------------
    mailpit:
        image: axllent/mailpit:latest
        container_name: sigr-mailpit
        restart: unless-stopped
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sigr-network

networks:
    sigr-network:
        driver: bridge

volumes:
    sigr-mysql-data:
        driver: local
    sigr-redis-data:
        driver: local
    sigr-vendor:
        driver: local
    sigr-public-build:
        driver: local
